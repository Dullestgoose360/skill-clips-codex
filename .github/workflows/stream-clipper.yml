name: Stream Clipper CI

on:
  push:
    branches:
      - "**"
    paths:
      - ".agents/skills/stream-clipper/**"
      - ".github/workflows/stream-clipper.yml"
  pull_request:
    paths:
      - ".agents/skills/stream-clipper/**"
      - ".github/workflows/stream-clipper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-clipper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: .agents/skills/stream-clipper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .agents/skills/stream-clipper/requirements.txt

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Verify FFmpeg tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run unit and synthetic audiovisual tests
        run: python -m unittest discover -s tests -v
